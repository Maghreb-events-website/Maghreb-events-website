    "primary":"#0ea5e9","surface-container":"#1b2024","on-primary":"#00344d",

<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
body{background:#0f1418;color:#dee3e9;font-family:'Inter',sans-serif;min-height:max(884px,100dvh)}

/* Tabs */
.me-tab{
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;
  color:var(--me-fg-muted);background:transparent;border:1px solid transparent;
  transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.me-tab:hover{background:var(--me-bg-elev-2);color:var(--me-fg)}
.me-tab.active{background:var(--me-bg-elev);border-color:var(--me-border);color:var(--me-primary);font-weight:500}

/* Data rows */
.me-row{
  display:grid;grid-template-columns:56px 1fr auto auto;
  align-items:center;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--me-border);
}
.me-row:last-child{border-bottom:0}
.me-row img.thumb{width:56px;height:56px;object-fit:contain;background:var(--me-bg-elev-2);border-radius:8px}

/* Toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--me-bg-elev-2);color:var(--me-fg);border:1px solid var(--me-border);
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;
  opacity:0;transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok {border-color:rgba(74,222,128,.4)}
#toast.err{border-color:rgba(252,165,165,.4)}

@keyframes me-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.me-spin{animation:me-spin .8s linear infinite;display:inline-block}
</style>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body class="me-page" data-active-nav="">
<div id="toast"></div>

<main class="px-6 max-w-6xl mx-auto pt-8 pb-24">

  <!-- Header -->
  <header class="mb-8 flex items-start justify-between flex-wrap gap-4">

      <h1 style="font-family:'Manrope',sans-serif" class="text-4xl font-light tracking-tight text-on-surface">Admin Panel</h1>

    <span id="role-badge" class="me-pill mt-2" style="font-size:11px"></span>

  <!-- Tabs -->
  <div style="overflow-x:auto;margin-bottom:24px">
    <nav id="tabs" class="flex gap-2" style="width:max-content;padding:4px;background:var(--me-bg-elev);border-radius:10px;border:1px solid var(--me-border)"></nav>
  </div>

  <!-- Panel content -->
  <section id="panel" class="me-card" style="padding:28px;min-height:300px"></section>

</main>

<!-- Modal backdrop -->
<div id="modal" class="me-modal-backdrop">
  <div class="me-modal" id="modal-inner" style="max-width:480px"></div>
</div>

<script src="/assets/site.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  AUTH GUARD — server-verified, fixes stale localStorage sessions
// ═══════════════════════════════════════════════════════════════════════════
let ME_USER = null;

(async () => {
  const tok = ME.auth.token();
  if (!tok) { window.location.href = '/login'; return; }

  try {
    const res = await fetch(ME.API + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' }
    });

    if (res.status === 401) {
      // Some deployments reject /auth/me despite a valid callback token.
      // Keep the current signed-in user state instead of forcing logout.
      throw new Error('auth_me_unauthorized');
    }
    if (!res.ok) throw new Error('Server error');

    const data = await res.json();
    const user = ME.auth.normalizeUser(data.admin || {});

    const cid = String((user && user.cid) || '');
    const cidAllowed = Array.isArray(ME.ADMIN_CIDS) && ME.ADMIN_CIDS.includes(cid);
    if (!user || ((user.role !== 'admin' && user.role !== 'superadmin') && !cidAllowed)) {
      window.location.href = '/';
      return;
    }

    localStorage.setItem('me_user', JSON.stringify(user));
    ME_USER = user;

    document.getElementById('subtitle').textContent =
      'Signed in as ' + ME_USER.name + '  ·  CID ' + ME_USER.cid;
    document.getElementById('role-badge').textContent = ME_USER.role;

    loadTab('partners');
  } catch (e) {
    console.error('Auth check failed:', e);
    const cached = ME.auth.normalizeUser(ME.auth.user() || ME.auth.tokenPayload() || {});
    const cachedCid = String(cached.cid || '');
    const cachedAllowed = Array.isArray(ME.ADMIN_CIDS) && ME.ADMIN_CIDS.includes(cachedCid);
    if (cached && (cached.role === 'admin' || cached.role === 'superadmin' || cachedAllowed)) {
      ME_USER = cached;
      ME.auth.setUser(cached);
      document.getElementById('subtitle').textContent =
        'Signed in as ' + ME_USER.name + '  ·  CID ' + ME_USER.cid;
      document.getElementById('role-badge').textContent = ME_USER.role;
      loadTab('partners');
    } else {
      window.location.href = '/login';
    }
  }
})();

const isSuperAdmin = () => ME_USER && ME_USER.role === 'superadmin';

// ═══════════════════════════════════════════════════════════════════════════
//  API HELPER
// ═══════════════════════════════════════════════════════════════════════════
async function api(path, method = 'GET', body = null) {
  // Accept either api(path, 'METHOD', body) or api(path, { method, body })
  if (method && typeof method === 'object') {
    body   = method.body ?? null;
    method = method.method || 'GET';
  }
  const headers = { 'Content-Type': 'application/json', ...ME.auth.headers() };
  const opts = { method, headers };
  if (body !== null) opts.body = JSON.stringify(body);

  let res;
  try {
    res = await fetch(`${ME.API}${path}`, opts);
  } catch (e) {
    throw new Error('Network error — cannot reach API server');
  }

  if (res.status === 401) throw new Error('Unauthorized request — please refresh and try again');

  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && (data.error || data.message)) || `HTTP ${res.status}`);
  return data;
}

async function apiUpload(path, formData) {
  const headers = { ...ME.auth.headers() };
  let res;
  try {
    res = await fetch(`${ME.API}${path}`, { method: 'POST', headers, body: formData });
  } catch (e) {
    throw new Error('Network error — cannot reach API server');
  }
  if (res.status === 401) throw new Error('Unauthorized request — please refresh and try again');
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && (data.error || data.message)) || `HTTP ${res.status}`);
  return data;
}

// ═══════════════════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════════════════
let _toastTimer;
function toast(msg, kind = 'ok') {
  const el = document.getElementById('toast');
  el.innerHTML = '';
  const icon = Object.assign(document.createElement('span'), { className: 'material-symbols-outlined' });
  icon.style.fontSize = '16px';
  icon.style.color = kind === 'err' ? '#fca5a5' : '#4ade80';
  icon.textContent = kind === 'err' ? 'error' : 'check_circle';
  el.appendChild(icon);
  el.appendChild(document.createTextNode(' ' + msg));
  el.className = `show ${kind}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

// ═══════════════════════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════════════════════
function openModal(html) {
  document.getElementById('modal-inner').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-inner').innerHTML = '';
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ═══════════════════════════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════════════════════════
const TABS = [
  { key: 'partners', label: 'Partners',      icon: 'handshake' },
  { key: 'airlines', label: 'Airlines',       icon: 'airlines' },
  { key: 'planning', label: 'Planning Team',  icon: 'groups' },
  { key: 'hitsquad', label: 'Hitsquad',       icon: 'emergency' },
  { key: 'briefing', label: 'Pilot Briefing', icon: 'description' },
  { key: 'events',   label: 'Events',         icon: 'event' },
  { key: 'allowedcids', label: 'Allowed CIDs', icon: 'verified_user' },
  { key: 'admins',   label: 'Admins',         icon: 'admin_panel_settings', superOnly: true },
];

let activeTab = 'partners'; // Fix initialization error

function renderTabs(key) {
  activeTab = key;
  document.getElementById('tabs').innerHTML = TABS
    .filter(t => !t.superOnly || isSuperAdmin())
    .map(t => `
      <button class="me-tab ${t.key === key ? 'active' : ''}" data-tab="${t.key}">
        <span class="material-symbols-outlined" style="font-size:15px">${t.icon}</span>
        ${t.label}
      </button>`)
    .join('');
  document.querySelectorAll('[data-tab]').forEach(b =>
    b.addEventListener('click', () => loadTab(b.dataset.tab)));
}

function loadTab(key) {
  renderTabs(key);
  PANELS[key]();
}

// ═══════════════════════════════════════════════════════════════════════════
//  SHARED UI HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function panelHTML(titleHTML, addBtnLabel, addBtnId) {
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--me-border)">
      <h2 style="font-family:'Manrope',sans-serif;font-size:22px;font-weight:300">${titleHTML}</h2>
      ${addBtnLabel ? `<button class="me-btn" id="${addBtnId}" style="display:inline-flex;align-items:center;gap:6px">
        <span class="material-symbols-outlined" style="font-size:15px">add</span>${addBtnLabel}
      </button>` : ''}
    </div>
    <div id="panel-list"><span style="color:var(--me-fg-muted);font-size:13px">Loading…</span></div>`;
}

function setListLoading(msg = 'Loading…') {
  document.getElementById('panel-list').innerHTML =
    `<span style="color:var(--me-fg-muted);font-size:13px">${msg}</span>`;
}

function setListError(msg) {
  document.getElementById('panel-list').innerHTML =
    `<div style="padding:12px 16px;border:1px solid rgba(252,165,165,.25);border-radius:8px;background:rgba(239,68,68,.05)">
      <p style="color:#fca5a5;font-weight:500;margin:0 0 4px">Failed to load data</p>
      <p style="color:var(--me-fg-muted);font-size:12px;margin:0">${msg}</p>
    </div>`;
}

function modalForm(title, formId, fieldsHTML, submitLabel) {
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h3 style="font-family:'Manrope',sans-serif;font-size:18px;font-weight:400">${title}</h3>
      <button type="button" onclick="closeModal()" style="background:none;border:none;color:var(--me-fg-muted);cursor:pointer;padding:4px;display:flex">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="${formId}" class="space-y-4" novalidate>
      ${fieldsHTML}
      <div id="form-error" style="display:none;padding:10px 14px;border:1px solid rgba(252,165,165,.3);border-radius:8px;background:rgba(239,68,68,.05);font-size:12px;color:#fca5a5"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;padding-top:4px">
        <button type="button" class="me-btn me-btn--ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="me-btn" id="form-submit">${submitLabel}</button>
      </div>
    </form>`;
}

function showFormError(msg) {
  const el = document.getElementById('form-error');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function setSubmitLoading(loading) {
  const btn = document.getElementById('form-submit');
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn.dataset.orig = btn.textContent;
    btn.innerHTML = '<span class="material-symbols-outlined me-spin" style="font-size:14px;vertical-align:middle">progress_activity</span> Saving…';
  } else {
    btn.textContent = btn.dataset.orig || 'Save';
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  PANELS
// ═══════════════════════════════════════════════════════════════════════════
const PANELS = {};

// ── PEOPLE (Planning Team + Hitsquad) ──────────────────────────────────────
function makePeoplePanel(endpoint, label, singularLabel) {
  return async function () {
    const panel = document.getElementById('panel');
    panel.innerHTML = panelHTML(label, `Add ${singularLabel}`, 'btn-add');

    // Capture endpoint in this closure scope, attach click AFTER innerHTML is set
    document.getElementById('btn-add').onclick = () => openPersonModal(endpoint, singularLabel, null);

    try {
      const result = await api(endpoint);
      const rows = result.data || [];
      const listEl = document.getElementById('panel-list');

      if (!rows.length) {
        listEl.innerHTML = `<p style="color:var(--me-fg-muted);padding:16px 0">No ${label.toLowerCase()} members yet.</p>`;
        return;
      }

      listEl.innerHTML = rows.map(p => `
        <div class="me-row">
          <img class="thumb" src="${p.photo_url || '/assets/avatar-placeholder.svg'}" alt=""
               onerror="this.src='/assets/avatar-placeholder.svg'"/>
          <div>
            <div style="color:var(--me-fg);font-weight:500">${escHtml(p.name)}</div>
            <div style="color:var(--me-fg-dim);font-size:12px">
              ${escHtml(p.role || '—')}${p.subsection ? '  ·  ' + escHtml(String(p.subsection).replace(/_/g,' ')) : ''}${p.cid ? '  ·  CID ' + escHtml(String(p.cid)) : ''}
            </div>
          </div>
          <button class="me-btn me-btn--ghost" data-edit-id="${p.id}"
                  style="display:inline-flex;align-items:center;gap:4px">
            <span class="material-symbols-outlined" style="font-size:14px">edit</span> Edit
          </button>
          <button class="me-btn me-btn--ghost" data-del-id="${p.id}"
                  style="color:#fca5a5;display:inline-flex;align-items:center;gap:4px">
            <span class="material-symbols-outlined" style="font-size:14px">delete</span>
          </button>
        </div>`).join('');

      // Edit buttons — find the row data inline from the rendered rows array
      listEl.querySelectorAll('[data-edit-id]').forEach(btn => {
        const id = Number(btn.dataset.editId);
        const person = rows.find(r => r.id === id);
        btn.onclick = () => openPersonModal(endpoint, singularLabel, person);
      });

      // Delete buttons
      listEl.querySelectorAll('[data-del-id]').forEach(btn => {
        const id = Number(btn.dataset.delId);
        const person = rows.find(r => r.id === id);
        btn.onclick = async () => {
          if (!confirm(`Remove ${person ? person.name : 'this person'}?`)) return;
          try {
            await api(`${endpoint}/${id}`, 'DELETE');
            toast('Removed');
            PANELS[activeTab](); // re-render current tab
          } catch (e) { toast(e.message, 'err'); }
        };
      });

    } catch (e) {
      setListError(e.message);
    }
  };
}

function openPersonModal(endpoint, singularLabel, person) {
  const v = person || {};
  const isEdit = !!person;
  const isPlanning = endpoint === '/planning';

  const subsectionOptions = [
    { value: 'team_leads',     label: 'Team Leads' },
    { value: 'communications', label: 'Communications' },
    { value: 'routes',         label: 'Routes' },
    { value: 'technology',     label: 'Technology' },
    { value: 'other',          label: 'Other / Team Members' },
  ];
  const subsectionField = isPlanning ? `
     <div><label class="me-label">Subsection *</label>
       <select class="me-input" name="subsection" required>
         <option value="" ${!v.subsection ? 'selected' : ''} disabled>Select a subsection…</option>
         ${subsectionOptions.map(o =>
           `<option value="${o.value}" ${v.subsection === o.value ? 'selected' : ''}>${o.label}</option>`
         ).join('')}
       </select></div>` : '';

  openModal(modalForm(
    `${isEdit ? 'Edit' : 'Add'} ${singularLabel}`,
    'person-form',
    `<div><label class="me-label">Name *</label>
       <input class="me-input" name="name" required value="${escAttr(v.name || '')}"/></div>
     <div><label class="me-label">Role / Position</label>
       <input class="me-input" name="role" value="${escAttr(v.role || '')}"/></div>
     ${subsectionField}
     <div><label class="me-label">VATSIM CID</label>
       <input class="me-input" name="cid" value="${escAttr(String(v.cid || ''))}"/></div>
     <div><label class="me-label">Photo URL</label>
       <input class="me-input" name="photo_url" value="${escAttr(v.photo_url || '')}" placeholder="https://…"/></div>
     <div><label class="me-label">Bio</label>
       <textarea class="me-input" name="bio" rows="3">${escHtml(v.bio || '')}</textarea></div>`,
    isEdit ? 'Save Changes' : 'Add Member'
  ));

  document.getElementById('person-form').onsubmit = async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target).entries());
    setSubmitLoading(true);
    try {
      if (isEdit) await api(`${endpoint}/${person.id}`, 'PUT', body);
      else        await api(endpoint, 'POST', body);
      closeModal();
      toast(isEdit ? 'Changes saved' : 'Member added');
      PANELS[activeTab]();
    } catch (err) { showFormError(err.message); setSubmitLoading(false); }
  };
}

PANELS.planning = makePeoplePanel('/planning', 'Planning Team', 'Planner');
PANELS.hitsquad = makePeoplePanel('/hitsquad', 'Hitsquad', 'Member');

// ── PARTNERS ───────────────────────────────────────────────────────────────
PANELS.partners = async function () {
  const panel = document.getElementById('panel');
  panel.innerHTML = panelHTML('Partners', 'Add Partner', 'btn-add');
  document.getElementById('btn-add').onclick = () => openPartnerModal(null);

  try {
    const result = await api('/partners');
    const rows = result.data || [];
    const listEl = document.getElementById('panel-list');

    if (!rows.length) {
      listEl.innerHTML = '<p style="color:var(--me-fg-muted);padding:16px 0">No partners yet.</p>';
      return;
    }

    listEl.innerHTML = rows.map(p => `
      <div class="me-row">
        <img class="thumb" src="${p.logo_url || '/assets/avatar-placeholder.svg'}" alt=""/>
        <div>
          <div style="color:var(--me-fg);font-weight:500">${escHtml(p.name)}</div>
          <div style="color:var(--me-fg-dim);font-size:12px">
            ${escHtml(p.type || '')} · ${escHtml(p.status || '')}
            ${p.website ? ` · <a href="${escAttr(p.website)}" target="_blank" style="color:var(--me-primary)">↗ website</a>` : ''}
          </div>
        </div>
        <button class="me-btn me-btn--ghost" data-edit-id="${p.id}"
                style="display:inline-flex;align-items:center;gap:4px">
          <span class="material-symbols-outlined" style="font-size:14px">edit</span> Edit
        </button>
        <button class="me-btn me-btn--ghost" data-del-id="${p.id}"
                style="color:#fca5a5;display:inline-flex;align-items:center;gap:4px">
          <span class="material-symbols-outlined" style="font-size:14px">delete</span>
        </button>
      </div>`).join('');

    listEl.querySelectorAll('[data-edit-id]').forEach(btn => {
      const p = rows.find(r => r.id === Number(btn.dataset.editId));
      btn.onclick = () => openPartnerModal(p);
    });
    listEl.querySelectorAll('[data-del-id]').forEach(btn => {
      const id = Number(btn.dataset.delId);
      const p = rows.find(r => r.id === id);
      btn.onclick = async () => {
        if (!confirm(`Delete partner "${p ? p.name : id}"?`)) return;
        try { await api(`/partners/${id}`, 'DELETE'); toast('Deleted'); PANELS.partners(); }
        catch (e) { toast(e.message, 'err'); }
      };
    });
  } catch (e) { setListError(e.message); }
};

function openPartnerModal(partner) {
  const v = partner || {};
  const isEdit = !!partner;
  openModal(modalForm(
    `${isEdit ? 'Edit' : 'Add'} Partner`, 'partner-form',
    `<div><label class="me-label">Name *</label>
       <input class="me-input" name="name" required value="${escAttr(v.name || '')}"/></div>
     <div><label class="me-label">Type *</label>
       <input class="me-input" name="type" required value="${escAttr(v.type || '')}" placeholder="Regional Division, ATC, VA…"/></div>
     <div><label class="me-label">Status</label>
       <select class="me-input" name="status">
         ${['pending','verified','suspended','inactive'].map(s =>
           `<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('')}
       </select></div>
     <div><label class="me-label">Logo URL</label>
       <input class="me-input" name="logo_url" value="${escAttr(v.logo_url || '')}" placeholder="https://…"/></div>
     <div><label class="me-label">Website URL</label>
       <input class="me-input" name="website" value="${escAttr(v.website || '')}" placeholder="https://…"/></div>
     <div><label class="me-label">Description</label>
       <textarea class="me-input" name="description" rows="2">${escHtml(v.description || '')}</textarea></div>
     <div><label class="me-label">Contact Email</label>
       <input type="email" class="me-input" name="contact_email" value="${escAttr(v.contact_email || '')}"/></div>`,

PANELS.briefing = async function () {
  const panel = document.getElementById('panel');
  panel.innerHTML = `

      <h2 style="font-family:'Manrope',sans-serif;font-size:22px;font-weight:300">Pilot Briefing PDFs</h2>
      <p style="color:var(--me-fg-muted);font-size:13px;margin-top:6px">

      </p>
    </div>
    <div id="panel-list"><span style="color:var(--me-fg-muted);font-size:13px">Loading briefings…</span></div>
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--me-border)">
      <h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Upload New Briefing</h3>
      <form id="briefing-form" class="space-y-4">
        <div><label class="me-label">Title (optional)</label>
          <input class="me-input" name="title" placeholder="e.g. New Year's Morocco — Pilot Briefing"/></div>
        <div><label class="me-label">PDF File *</label>
          <input class="me-input" type="file" name="pdf" accept="application/pdf" required style="cursor:pointer"/></div>
        <div id="upload-error" style="display:none;padding:10px 14px;border:1px solid rgba(252,165,165,.3);border-radius:8px;background:rgba(239,68,68,.05);font-size:12px;color:#fca5a5"></div>
        <button class="me-btn" type="submit" id="upload-btn"
                style="display:inline-flex;align-items:center;gap:6px">
          <span class="material-symbols-outlined" style="font-size:16px">upload</span> Upload Briefing
        </button>
      </form>
    </div>`;

  async function loadBriefings() {
    try {
      const res = await api('/briefing');
      const briefings = res.data || [];
      if (!briefings.length) {
        document.getElementById('panel-list').innerHTML =
          '<p style="color:var(--me-fg-muted);font-size:13px">No briefings uploaded yet.</p>';
        return;
      }
      document.getElementById('panel-list').innerHTML = `
        <div style="display:flex;flex-direction:column;gap:10px">
          ${briefings.map((b, i) => `
            <div class="me-row" style="grid-template-columns:auto 1fr auto auto;align-items:center" data-id="${b.id}">
              <span class="material-symbols-outlined" style="color:var(--me-primary);font-size:28px">picture_as_pdf</span>
              <div>
                <div style="color:var(--me-fg);font-weight:500;font-size:14px">
                  ${escHtml(b.title || 'Briefing')}
                  ${i === 0 ? '<span style="margin-left:8px;font-size:10px;background:rgba(245,158,11,0.15);color:var(--me-primary);padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:0.08em">Latest</span>' : ''}
                </div>
                <div style="color:var(--me-fg-dim);font-size:12px">
                  Uploaded ${new Date(b.created_at).toLocaleString('en-GB')}
                </div>
              </div>
              <a class="me-btn me-btn--ghost" href="${escAttr(b.url)}" target="_blank"
                 style="text-decoration:none;font-size:12px;padding:6px 12px">View</a>
              <button class="me-btn" data-delete-id="${b.id}"
                style="background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.25);font-size:12px;padding:6px 12px;display:inline-flex;align-items:center;gap:4px">
                <span class="material-symbols-outlined" style="font-size:14px">delete</span> Delete
              </button>
            </div>
          `).join('')}
        </div>`;

      // Attach delete handlers
      document.querySelectorAll('[data-delete-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.deleteId;
          const label = btn.closest('[data-id]').querySelector('[style*="font-weight"]').textContent.trim();
          if (!confirm(`Delete "${label}"? This cannot be undone.`)) return;
          btn.disabled = true;
          btn.innerHTML = '<span class="material-symbols-outlined me-spin" style="font-size:14px">progress_activity</span>';
          try {
            await api(`/briefing/${id}`, { method: 'DELETE' });
            toast('Briefing deleted');
            loadBriefings();
          } catch (err) {
            toast('Delete failed: ' + err.message, true);
            btn.disabled = false;
            btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">delete</span> Delete';
          }
        });

      document.getElementById('panel-list').innerHTML =

  document.getElementById('briefing-form').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = document.getElementById('upload-btn');
    const errEl = document.getElementById('upload-error');

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined me-spin" style="font-size:14px">progress_activity</span> Uploading…';
    try {
      await apiUpload('/briefing', fd);
      toast('Briefing uploaded');
      e.target.reset();
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">upload</span> Upload Briefing';
      loadBriefings();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">upload</span> Upload Briefing';
    }
  };
};

function openEventModal(event) {
  const v = event || {};
  const isEdit = !!event;

  // Format datetime-local value from stored string
  const fmtDT = (s) => s ? s.replace(' ', 'T').slice(0, 16) : '';

  openModal(modalForm(
    `${isEdit ? 'Edit' : 'Add'} Event`, 'event-form',
    `<div><label class="me-label">Title *</label>
       <input class="me-input" name="title" required value="${escAttr(v.title || '')}"/></div>
     <div><label class="me-label">Description</label>
       <textarea class="me-input" name="description" rows="2">${escHtml(v.description || '')}</textarea></div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
       <div><label class="me-label">Start Time *</label>
         <input type="datetime-local" class="me-input" name="start_time" required
                value="${escAttr(fmtDT(v.start_time))}"/></div>
       <div><label class="me-label">End Time *</label>
         <input type="datetime-local" class="me-input" name="end_time" required
                value="${escAttr(fmtDT(v.end_time))}"/></div>
     </div>
     <div><label class="me-label">Status</label>
       <select class="me-input" name="status">
         ${['upcoming','active','completed','cancelled'].map(s =>
           `<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('')}
       </select></div>
     <div><label class="me-label">Banner Image URL</label>
       <input class="me-input" name="banner_url" value="${escAttr(v.banner_url || '')}"
              placeholder="https://…"/></div>`,
    isEdit ? 'Save Changes' : 'Create Event'
  ));

  document.getElementById('event-form').onsubmit = async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target).entries());
    // Convert datetime-local back to "YYYY-MM-DD HH:MM" for the backend
    if (body.start_time) body.start_time = body.start_time.replace('T', ' ');
    if (body.end_time)   body.end_time   = body.end_time.replace('T', ' ');
    setSubmitLoading(true);
    try {
      if (isEdit) await api(`/events/${event.id}`, 'PUT', body);
      else        await api('/events', 'POST', body);
      closeModal(); toast(isEdit ? 'Event updated' : 'Event created'); PANELS.events();
    } catch (err) { showFormError(err.message); setSubmitLoading(false); }
  };
}

// ═══════════════════════════════════════════════════════════════════════════
//  ESCAPE HELPERS (prevent XSS from API data)
// ═══════════════════════════════════════════════════════════════════════════
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) { return escHtml(str); }
