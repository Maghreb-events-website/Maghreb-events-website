<script>
(function() {
    const GIF_URL = 'assets/bg-img.gif';
    const img = document.getElementById('bg-gif');
    let duration = null;
    let startTime = null;

    // Detect GIF duration by fetching and parsing the frame delays
    async function getGifDuration(url) {
        try {
            const res = await fetch(url);
            const buf = await res.arrayBuffer();
            const data = new Uint8Array(buf);
            let delay = 0;
            for (let i = 0; i < data.length - 4; i++) {
                // Graphic Control Extension block: 0x21 0xF9 0x04
                if (data[i] === 0x21 && data[i+1] === 0xF9 && data[i+2] === 0x04) {
                    delay += (data[i+4] | (data[i+5] << 8)) * 10; // centiseconds → ms
                    i += 5;
                }
            }
            return delay || null;
        } catch { return null; }
    }

    function restartGif() {
        img.src = GIF_URL + '?t=' + Date.now();
        startTime = Date.now();
    }

    getGifDuration(GIF_URL).then(ms => {
        if (!ms) { 
            // Fallback: restart every 8 seconds if duration undetectable
            ms = 8000;
        }
        duration = ms;
        startTime = Date.now();
        function loop() {
            const elapsed = Date.now() - startTime;
            if (elapsed >= duration - 200) {
                restartGif();
                setTimeout(loop, duration);
            } else {
                setTimeout(loop, duration - elapsed - 200);
            }
        }
        setTimeout(loop, duration - 200);
    });
})();
</script>

<script>
// ── Hardcoded Events ──────────────────────────────────────────────────────
// To update the countdown event, edit the UPCOMING_EVENT below.
// Set start_time to an ISO date string (UTC). Set title to the event name.
const UPCOMING_EVENT = {
  title: "New Year's in Morocco",
  start_time: "2026-12-31T22:00:00Z"
};

// Display the event name and start the countdown
document.getElementById('event1-name').textContent = UPCOMING_EVENT.title;
startCountdown('cd1', UPCOMING_EVENT.start_time);

function startCountdown(prefix, isoTarget) {
    const target = new Date(isoTarget).getTime();

    function tick() {
        const diff = Math.max(0, target - Date.now());
        const days = Math.floor(diff / 86400000);
        const hrs  = Math.floor((diff % 86400000) / 3600000);
        const min  = Math.floor((diff % 3600000)  / 60000);
        const sec  = Math.floor((diff % 60000)    / 1000);

        document.getElementById(prefix + '-days').textContent = String(days).padStart(2, '0');
        document.getElementById(prefix + '-hrs').textContent  = String(hrs).padStart(2, '0');
        document.getElementById(prefix + '-min').textContent  = String(min).padStart(2, '0');
        const secEl = document.getElementById(prefix + '-sec');
        if (secEl) secEl.textContent = String(sec).padStart(2, '0');
    }
    tick();
    setInterval(tick, 1000);
}

// Keyframes
const style = document.createElement('style');
style.textContent = `
    @keyframes spin  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
`;
document.head.appendChild(style);

// Arabic font
const fontLink = document.createElement('link');
fontLink.rel = 'stylesheet';
fontLink.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400&display=swap';
document.head.appendChild(fontLink);

// ── Typewriter Cycling ───────────────────────────────────────────────────────
(function () {
    const phrases = [
        { text: "Welcome to New Years in Morocco",       dir: "ltr" },
        { text: "مرحبا بكم في رأس السنة في المغرب",     dir: "rtl" },
        { text: "Bienvenue au Nouvel An au Maroc",        dir: "ltr" },
        { text: "Bienvenidos al Año Nuevo en Marruecos", dir: "ltr" },
        { text: "Willkommen zum Neujahr in Marokko",     dir: "ltr" }
    ];

    const span = document.getElementById('typewriter-span');
    const h1   = document.getElementById('welcome-text');
    let phraseIdx = 0;
    let charIdx   = 0;
    let deleting  = false;

    function tick() {
        const { text, dir } = phrases[phraseIdx];

        h1.style.direction  = dir;
        h1.style.textAlign  = dir === 'rtl' ? 'right' : 'center';
        span.style.fontFamily = dir === 'rtl'
            ? "'Noto Sans Arabic', 'Manrope', sans-serif"
            : "'Manrope', sans-serif";

        if (!deleting) {
            charIdx++;
            span.textContent = text.slice(0, charIdx);
            if (charIdx === text.length) {
                deleting = true;
                setTimeout(tick, 2400);
            } else {
                setTimeout(tick, dir === 'rtl' ? 60 : 50);
            }
        } else {
            charIdx--;
            span.textContent = text.slice(0, charIdx);
            if (charIdx === 0) {
                deleting  = false;
                phraseIdx = (phraseIdx + 1) % phrases.length;
                setTimeout(tick, 380);
            } else {
                setTimeout(tick, 30);
            }
        }
    }

    setTimeout(tick, 700);
})();
</script>
