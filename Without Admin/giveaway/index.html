<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Giveaways | Maghreb Events</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-surface": "#dee3e9", "surface": "#0f1418",
          "surface-container-lowest": "#0a0f13", "surface-container-low": "#171c20",
          "secondary": "#a5cbe9", "surface-tint": "#89ceff",
          "tertiary": "#ffb86e", "surface-variant": "#30353a",
          "secondary-container": "#234b64", "outline": "#88929b",
          "on-surface-variant": "#bec8d2", "inverse-surface": "#dee3e9",
          "surface-bright": "#353a3e", "primary-fixed-dim": "#89ceff",
          "primary": "#0ea5e9", "surface-container": "#1b2024",
          "on-primary": "#00344d", "primary-container": "#0ea5e9",
          "surface-dim": "#0f1418", "secondary-fixed-dim": "#a5cbe9",
          "surface-container-highest": "#30353a", "outline-variant": "#3e4850",
          "error": "#ffb4ab", "surface-container-high": "#252b2f",
          "tertiary-fixed-dim": "#ffb86e", "tertiary-fixed": "#ffdcbd"
        },
        borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
        fontFamily: { "headline": ["Manrope"], "body": ["Inter"], "label": ["Inter"] }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { background-color:var(--me-bg); color:var(--me-fg); font-family:'Inter',sans-serif; min-height:max(884px,100dvh); }

  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 rgba(14,165,233,0)} 50%{box-shadow:0 0 24px 4px rgba(14,165,233,0.18)} }
  @keyframes winner-reveal { 0%{opacity:0;transform:scale(0.85) translateY(20px)} 60%{transform:scale(1.04) translateY(-4px)} 100%{opacity:1;transform:scale(1) translateY(0)} }

  .giveaway-card {
    background: var(--me-bg-elev);
    border: 1px solid var(--me-border);
    border-radius: 12px;
    padding: 28px;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
  }
  .giveaway-card:hover { border-color: rgba(14,165,233,0.3); }

  .giveaway-card.status-open {
    border-color: rgba(14,165,233,0.25);
    animation: pulse-glow 3s ease-in-out infinite, fadeUp 0.4s ease both;
  }
  .giveaway-card.status-drawn {
    border-color: rgba(167,139,250,0.3);
  }

  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 999px;
  }
  .status-pill.upcoming { background: rgba(137,206,255,.1); color: #89ceff; }
  .status-pill.open     { background: rgba(74,222,128,.12); color: #4ade80; }
  .status-pill.closed   { background: rgba(255,184,110,.12); color: #ffb86e; }
  .status-pill.drawn    { background: rgba(167,139,250,.12); color: #a78bfa; }

  .enter-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: #0ea5e9; color: #00344d;
    padding: 12px 28px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    text-decoration: none;
  }
  .enter-btn:hover:not(:disabled) { background: #38bdf8; transform: translateY(-1px); }
  .enter-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .enter-btn.entered {
    background: rgba(74,222,128,.12); color: #4ade80;
    border: 1px solid rgba(74,222,128,.25); cursor: default;
  }

  .prize-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,184,110,.08); color: #ffb86e;
    border: 1px solid rgba(255,184,110,.15);
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
  }

  .winner-card {
    background: linear-gradient(135deg, rgba(167,139,250,.12) 0%, rgba(139,92,246,.06) 100%);
    border: 1px solid rgba(167,139,250,.3);
    border-radius: 10px; padding: 20px;
    animation: winner-reveal 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }

  .winner-item {
    padding: 12px;
    background: rgba(167,139,250,.05);
    border: 1px solid rgba(167,139,250,.15);
    border-radius: 8px;
  }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--me-bg-elev-3); color: var(--me-fg); border: 1px solid var(--me-border);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 9999;
    opacity: 0; transition: all .25s; pointer-events: none;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok  { border-color: rgba(74,222,128,.35); }
  #toast.err { border-color: rgba(252,165,165,.35); }
</style>
<link rel="stylesheet" href="/assets/site.css"/>
<link rel="stylesheet" href="/assets/light-mode-fixes.css"/>
</head>
<body class="min-h-screen flex flex-col" data-active-nav="giveaway">

<div id="toast"></div>

<main class="flex-grow pt-24 pb-32 px-6 max-w-4xl mx-auto w-full">

  <!-- Page Header -->
  <section class="mb-12">
    <div class="flex items-center gap-3 mb-4">
      <span class="material-symbols-outlined text-primary" style="font-size:32px">redeem</span>
      <h2 class="font-headline font-light text-5xl md:text-6xl text-on-surface tracking-tight">Giveaways</h2>
    </div>
    <p class="font-body text-on-surface-variant text-lg max-w-2xl leading-relaxed">
      Enter prize draws exclusive to Maghreb Events participants. Complete the form to register your entry — eligibility will be verified against event attendance records.
    </p>
  </section>

  <!-- Giveaway list -->
  <div id="giveaway-list" style="display:flex;flex-direction:column;gap:20px"></div>

</main>

<script>
// ============================================================
//  GIVEAWAY DATA — edit this array to manage all giveaways
// ============================================================
//
//  status:   "upcoming" | "open" | "drawn"
//  prizes:   array of prize name strings
//  formUrl:  Google Form URL (only used when status is "open")
//  entries:  number shown at bottom, or null to hide
//  winners:  array of { cid, prize } objects (only used when status is "drawn")
//
const GIVEAWAYS = [
  {
    status: "open",
    title: "Maghreb Events Merchandise Pack",
    description: "Exclusive branded merchandise including a pilot shirt, cap, and stickers. Perfect for collectors of VATSIM events.",
    prizes: ["Pilot Shirt"],
    formUrl: "https://forms.gle/your-form-id-1",
    entries: 24,
    winners: []
  },
  {
    status: "open",
    title: "Flight Simulator Add-on Bundle",
    description: "A collection of premium aircraft and scenery add-ons for your favorite flight simulator platform. Two lucky winners!",
    prizes: ["Aircraft A320", "Scenery Pack"],
    formUrl: "https://forms.gle/your-form-id-2",
    entries: 18,
    winners: []
  },
  {
    status: "upcoming",
    title: "Event Trophy & Certificate",
    description: "Commemorative trophy and signed certificate for participation in Maghreb Events.",
    prizes: ["Trophy"],
    formUrl: null,
    entries: null,
    winners: []
  },
  {
    status: "drawn",
    title: "VIP Networking Experience",
    description: "Winner receives exclusive access to a virtual networking event with VATSIM administrators and event organizers.",
    prizes: ["VIP Access"],
    formUrl: null,
    entries: 42,
    winners: [
      { cid: "1635257", prize: "VIP Access" }
    ]
  },
  {
    status: "drawn",
    title: "Annual VATSIM Subscription Bundle",
    description: "One year of premium VATSIM features and benefits. Two lucky pilots selected!",
    prizes: ["1-Year VATSIM Pro", "1-Year VATSIM Plus"],
    formUrl: null,
    entries: 67,
    winners: [
      { cid: "1797446", prize: "1-Year VATSIM Pro" },
      { cid: "1234567", prize: "1-Year VATSIM Plus" }
    ]
  }
];
// ============================================================
//  END OF DATA — rendering code below, no need to edit
// ============================================================

function renderGiveaways() {
  const list = document.getElementById('giveaway-list');

  GIVEAWAYS.forEach(function(g) {
    const card = document.createElement('div');
    card.className = 'giveaway-card status-' + g.status;

    // Status pill
    let pillHtml = '';
    if (g.status === 'open') {
      pillHtml = '<span class="status-pill open"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;margin-right:2px;animation:pulse-glow 1.5s ease-in-out infinite"></span>Open — Enter Now</span>';
    } else if (g.status === 'upcoming') {
      pillHtml = '<span class="status-pill upcoming">Coming Soon</span>';
    } else if (g.status === 'drawn') {
      pillHtml = '<span class="status-pill drawn">Winner' + (g.winners.length > 1 ? 's' : '') + ' Drawn</span>';
    }

    // Prize chips
    const prizeChips = g.prizes.map(function(p) {
      return '<span class="prize-chip"><span class="material-symbols-outlined" style="font-size:13px">emoji_events</span>' + p + '</span>';
    }).join('');

    // Action area
    let actionHtml = '';
    if (g.status === 'open') {
      actionHtml = `
        <div style="margin-top:20px">
          <a href="${g.formUrl}" target="_blank" rel="noopener noreferrer" class="enter-btn">
            <span class="material-symbols-outlined" style="font-size:16px">redeem</span>
            Enter Giveaway
          </a>
          <p style="font-size:11px;color:var(--me-fg-dim);text-align:center;margin:8px 0 0">Click to fill out the entry form</p>
        </div>`;
    } else if (g.status === 'upcoming') {
      actionHtml = `
        <div style="margin-top:20px;padding:12px 16px;background:rgba(137,206,255,.05);border:1px solid rgba(137,206,255,.1);border-radius:8px;text-align:center">
          <p style="font-size:13px;color:var(--me-fg-muted);margin:0">
            <span class="material-symbols-outlined" style="font-size:15px;vertical-align:-3px;color:#89ceff">schedule</span>
            This giveaway isn't open yet. Check back soon.
          </p>
        </div>`;
    }

    // Winners section
    let winnersHtml = '';
    if (g.status === 'drawn' && g.winners.length > 0) {
      const multi = g.winners.length > 1;
      const winnerItems = g.winners.map(function(w) {
        if (multi) {
          return `
            <div class="winner-item">
              <p style="font-size:14px;font-weight:600;color:var(--me-fg);margin:0 0 4px">CID ${w.cid}</p>
              <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,184,110,.1);border:1px solid rgba(255,184,110,.2);border-radius:6px;padding:4px 10px;font-size:12px;color:#ffb86e">
                <span class="material-symbols-outlined" style="font-size:14px">emoji_events</span> ${w.prize}
              </div>
            </div>`;
        } else {
          return `
            <p style="font-size:15px;font-weight:600;color:var(--me-fg);margin:0 0 4px">CID ${w.cid}</p>
            <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,184,110,.1);border:1px solid rgba(255,184,110,.2);border-radius:6px;padding:5px 12px;font-size:13px;color:#ffb86e">
              <span class="material-symbols-outlined" style="font-size:15px">emoji_events</span>${w.prize}
            </div>`;
        }
      }).join('');

      winnersHtml = `
        <div class="winner-card" style="margin-top:16px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:${multi ? 14 : 10}px">
            <span style="font-size:22px">🏆</span>
            <span style="font-size:14px;font-weight:600;color:#a78bfa">Winner${multi ? 's' : ''} Announced</span>
          </div>
          ${multi ? '<div style="display:flex;flex-direction:column;gap:10px">' + winnerItems + '</div>' : winnerItems}
        </div>`;
    }

    // Entries count
    const entriesHtml = g.entries != null
      ? `<p style="font-size:12px;color:var(--me-fg-dim);margin:12px 0 0">
           <span class="material-symbols-outlined" style="font-size:14px;vertical-align:-3px">group</span>
           ${g.entries} entries submitted
         </p>`
      : '';

    card.innerHTML = `
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px">
        ${pillHtml}
      </div>
      <h3 style="font-family:'Manrope',sans-serif;font-size:22px;font-weight:500;color:var(--me-fg);margin:0 0 6px">${g.title}</h3>
      <p style="font-size:14px;color:var(--me-fg-muted);line-height:1.6;margin:0">${g.description}</p>
      <div style="margin-top:14px">
        <p style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--me-fg-dim);margin:0 0 8px">Prize Pool</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${prizeChips}</div>
      </div>
      ${winnersHtml}
      ${actionHtml}
      ${entriesHtml}
    `;

    list.appendChild(card);
  });
}

renderGiveaways();
</script>

<script src="/assets/site.js"></script>
</body></html>
